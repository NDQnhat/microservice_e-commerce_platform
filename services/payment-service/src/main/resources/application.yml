server:
  port: 8087

spring:
  application:
    name: payment-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

jwt:
  secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3ItZGlzdHJpYnV0ZWQtZWNvbW1lcmNl}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

payment:
  webhook:
    secret: ${PAYMENT_WEBHOOK_SECRET:gateway-shared-secret-12345}
  timeout:
    minutes: ${PAYMENT_TIMEOUT_MINUTES:15}

services:
  order:
    url: ${SERVICES_ORDER_URL:http://localhost:8086}
  inventory:
    url: ${SERVICES_INVENTORY_URL:http://localhost:8085}
  exception:
    url: ${SERVICES_EXCEPTION_URL:http://localhost:8092}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
