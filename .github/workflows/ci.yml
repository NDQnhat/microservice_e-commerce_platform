name: Continuous Integration

on:
  push:
    branches: [ main, master, 'feat/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Compile and Test all backend services
        run: ./gradlew testClasses test --no-daemon

  frontend-build:
    name: Frontend Applications Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test User Web (Next.js 15)
        run: |
          cd apps/user-web
          npm ci
          npm run test

      - name: Test Admin Web (Vite 7)
        run: |
          cd apps/admin-web
          npm ci
          npm run test
