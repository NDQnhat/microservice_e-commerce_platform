# ============================================================================
# E-COMMERCE PLATFORM — DOCKER COMPOSE (RAM-OPTIMIZED FOR DEV)
# ============================================================================
#
# CORE INFRA (always on, ~1.2 GiB actual):
#   docker compose up -d
#   Starts: postgres, redis, kafka (KRaft), service-discovery,
#           api-gateway, business-configuration-service
#
# OPTIONAL TOOLS (start when needed):
#   docker compose --profile tools up -d
#   Starts: kafka-ui, minio
#
# OBSERVABILITY (start when debugging metrics/traces):
#   docker compose --profile observability up -d
#   Starts: prometheus, grafana, tempo, otel-collector
#
# BUSINESS FLOWS (start the flow you need to test):
#   docker compose --profile flow-identity up -d      # auth/login
#   docker compose --profile flow-catalog up -d       # products/pricing
#   docker compose --profile flow-cart up -d          # shopping cart
#   docker compose --profile flow-order up -d         # orders/payment/inventory
#   docker compose --profile flow-fulfillment up -d   # shipping/notifications
#   docker compose --profile flow-admin up -d         # audit/exceptions
#
# STOP EVERYTHING:
#   docker compose --profile tools --profile observability \
#     --profile flow-identity --profile flow-catalog --profile flow-cart \
#     --profile flow-order --profile flow-fulfillment --profile flow-admin down
# ============================================================================

services:

  postgresql:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    command: "postgres -c max_connections=300 -c shared_buffers=128MB"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgresql/init-scripts/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    mem_limit: 64m

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: ecommerce-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
    mem_limit: 384m

  # ============================================================================
  # OPTIONAL TOOLS — enable with --profile tools
  # ============================================================================

  kafka-ui:
    profiles: [tools]
    image: provectuslabs/kafka-ui:latest
    container_name: ecommerce-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: "-Xmx128M -Xms64M"
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 96M
    mem_limit: 192m

  minio:
    profiles: [tools]
    image: cgr.dev/chainguard/minio:latest
    container_name: ecommerce-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    mem_limit: 128m

  # ============================================================================
  # OBSERVABILITY — enable with --profile observability
  # ============================================================================

  prometheus:
    profiles: [observability]
    image: prom/prometheus:latest
    container_name: ecommerce-prometheus
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    mem_limit: 128m

  grafana:
    profiles: [observability]
    image: grafana/grafana:latest
    container_name: ecommerce-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 96M
    mem_limit: 192m

  tempo:
    profiles: [observability]
    image: grafana/tempo:latest
    container_name: ecommerce-tempo
    user: "root"
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ../observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    mem_limit: 64m

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:latest
    container_name: ecommerce-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ../observability/otel/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - tempo
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 48M
    mem_limit: 96m

  # ============================================================================
  # PLATFORM CORE — Luôn chạy cùng infra
  # ============================================================================

  service-discovery:
    build:
      context: ../../services/service-discovery
      dockerfile: Dockerfile
    container_name: ecommerce-service-discovery
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: service-discovery
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx160m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=96m
        -Dspring.jmx.enabled=false
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m

  api-gateway:
    build:
      context: ../../services/api-gateway
      dockerfile: Dockerfile
    container_name: ecommerce-api-gateway
    depends_on:
      - service-discovery
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx192m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=96m
        -Dspring.jmx.enabled=false
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m

  business-configuration-service:
    build:
      context: ../../services/business-configuration-service
      dockerfile: Dockerfile
    container_name: ecommerce-business-config
    depends_on:
      postgresql:
        condition: service_healthy
      service-discovery:
        condition: service_started
      kafka:
        condition: service_healthy
    ports:
      - "8091:8091"
    environment:
      SERVER_PORT: 8091
      DATABASE_URL: jdbc:postgresql://postgresql:5432/business_configuration_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx192m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=96m
        -Dspring.jmx.enabled=false
        -Dspring.backgroundpreinitializer.ignore=true
        -XX:TieredStopAtLevel=1
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m

  # ============================================================================
  # BUSINESS SERVICES — Mở theo luồng nghiệp vụ cần test
  # ----------------------------------------------------------------------------
  # FLOW MAP:
  #   flow-identity  → identity-access-service
  #   flow-catalog   → catalog + pricing + identity
  #   flow-cart      → cart + catalog + pricing + identity
  #   flow-order     → order + payment + inventory + cart + catalog + pricing + identity
  #   flow-fulfillment → fulfillment + notification + order
  #   flow-admin     → audit + exception-management
  # ============================================================================

  # --- FLOW: IDENTITY & AUTH ---
  # Test: đăng ký, đăng nhập, phân quyền
  # Lệnh: docker compose --profile flow-identity up -d
  identity-access-service:
    profiles: [flow-identity, flow-catalog, flow-cart, flow-order]
    build:
      context: ../../services/identity-access-service
      dockerfile: Dockerfile
    container_name: ecommerce-identity-service
    depends_on:
      postgresql:
        condition: service_healthy
      service-discovery:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgresql:5432/identity_access_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx192m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=96m
        -Dspring.jmx.enabled=false
        -Dspring.backgroundpreinitializer.ignore=true
        -XX:TieredStopAtLevel=1
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m

  # --- FLOW: CATALOG & PRICING ---
  # Test: duyệt sản phẩm, xem giá, tìm kiếm
  # Lệnh: docker compose --profile flow-catalog up -d
  catalog-service:
    build:
      context: ../../services/catalog-service
      dockerfile: Dockerfile
    container_name: ecommerce-catalog-service
    profiles: [flow-catalog, flow-cart, flow-order]
    depends_on:
      postgresql:
        condition: service_healthy
      service-discovery:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DATABASE_URL: jdbc:postgresql://postgresql:5432/catalog_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx192m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=96m
        -Dspring.jmx.enabled=false
        -Dspring.backgroundpreinitializer.ignore=true
        -XX:TieredStopAtLevel=1
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m

  pricing-service:
    build:
      context: ../../services/pricing-service
      dockerfile: Dockerfile
    container_name: ecommerce-pricing-service
    profiles: [flow-catalog, flow-cart, flow-order]
    depends_on:
      postgresql:
        condition: service_healthy
      service-discovery:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DATABASE_URL: jdbc:postgresql://postgresql:5432/pricing_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx192m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=96m
        -Dspring.jmx.enabled=false
        -Dspring.backgroundpreinitializer.ignore=true
        -XX:TieredStopAtLevel=1
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m

  # --- FLOW: SHOPPING CART ---
  # Test: thêm/xóa giỏ hàng, tính tổng tiền
  # Lệnh: docker compose --profile flow-cart up -d
  cart-service:
    build:
      context: ../../services/cart-service
      dockerfile: Dockerfile
    container_name: ecommerce-cart-service
    profiles: [flow-cart, flow-order]
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-discovery:
        condition: service_started
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      DATABASE_URL: jdbc:postgresql://postgresql:5432/cart_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx192m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=96m
        -Dspring.jmx.enabled=false
        -Dspring.backgroundpreinitializer.ignore=true
        -XX:TieredStopAtLevel=1
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m

  # --- FLOW: ORDER & PAYMENT ---
  # Test: đặt hàng, thanh toán, kiểm tra tồn kho
  # Lệnh: docker compose --profile flow-order up -d
  inventory-service:
    build:
      context: ../../services/inventory-service
      dockerfile: Dockerfile
    container_name: ecommerce-inventory-service
    profiles: [flow-order]
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_started
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      DATABASE_URL: jdbc:postgresql://postgresql:5432/inventory_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx192m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=96m
        -Dspring.jmx.enabled=false
        -Dspring.backgroundpreinitializer.ignore=true
        -XX:TieredStopAtLevel=1
    deploy:
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 160M
    mem_limit: 320m

  order-service:
    build:
      context: ../../services/order-service
      dockerfile: Dockerfile
    container_name: ecommerce-order-service
    profiles: [flow-order, flow-fulfillment]
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_started
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      DATABASE_URL: jdbc:postgresql://postgresql:5432/order_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      INVENTORY_SERVICE_URL: http://inventory-service:8085
      PRICING_SERVICE_URL: http://pricing-service:8083
      CART_SERVICE_URL: http://cart-service:8084
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx192m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=96m
        -Dspring.jmx.enabled=false
        -Dspring.backgroundpreinitializer.ignore=true
        -XX:TieredStopAtLevel=1
    deploy:
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 160M
    mem_limit: 320m

  payment-service:
    build:
      context: ../../services/payment-service
      dockerfile: Dockerfile
    container_name: ecommerce-payment-service
    profiles: [flow-order]
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_started
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      DATABASE_URL: jdbc:postgresql://postgresql:5432/payment_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      ORDER_SERVICE_URL: http://order-service:8086
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx192m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=96m
        -Dspring.jmx.enabled=false
        -Dspring.backgroundpreinitializer.ignore=true
        -XX:TieredStopAtLevel=1
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m

  # --- FLOW: FULFILLMENT & NOTIFICATION ---
  # Test: xử lý giao hàng, gửi thông báo
  # Lệnh: docker compose --profile flow-fulfillment up -d
  fulfillment-service:
    build:
      context: ../../services/fulfillment-service
      dockerfile: Dockerfile
    container_name: ecommerce-fulfillment-service
    profiles: [flow-fulfillment]
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_started
    ports:
      - "8098:8088"
    environment:
      SERVER_PORT: 8088
      DATABASE_URL: jdbc:postgresql://postgresql:5432/fulfillment_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      ORDER_SERVICE_URL: http://order-service:8086
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx192m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=96m
        -Dspring.jmx.enabled=false
        -Dspring.backgroundpreinitializer.ignore=true
        -XX:TieredStopAtLevel=1
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m

  notification-service:
    build:
      context: ../../services/notification-service
      dockerfile: Dockerfile
    container_name: ecommerce-notification-service
    profiles: [flow-fulfillment]
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_started
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: 8089
      DATABASE_URL: jdbc:postgresql://postgresql:5432/notification_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx192m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=96m
        -Dspring.jmx.enabled=false
        -Dspring.backgroundpreinitializer.ignore=true
        -XX:TieredStopAtLevel=1
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m

  # --- FLOW: ADMIN & COMPLIANCE ---
  # Test: audit log, cấu hình hệ thống, xử lý ngoại lệ
  # Lệnh: docker compose --profile flow-admin up -d
  audit-compliance-service:
    build:
      context: ../../services/audit-compliance-service
      dockerfile: Dockerfile
    container_name: ecommerce-audit-service
    profiles: [flow-admin]
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_started
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      DATABASE_URL: jdbc:postgresql://postgresql:5432/audit_compliance_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx192m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=96m
        -Dspring.jmx.enabled=false
        -Dspring.backgroundpreinitializer.ignore=true
        -XX:TieredStopAtLevel=1
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m

  exception-management-service:
    build:
      context: ../../services/exception-management-service
      dockerfile: Dockerfile
    container_name: ecommerce-exception-service
    profiles: [flow-admin]
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_started
    ports:
      - "8092:8092"
    environment:
      SERVER_PORT: 8092
      DATABASE_URL: jdbc:postgresql://postgresql:5432/exception_management_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx192m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=96m
        -Dspring.jmx.enabled=false
        -Dspring.backgroundpreinitializer.ignore=true
        -XX:TieredStopAtLevel=1
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
  prometheus-data:
  grafana-data:
  tempo-data:
