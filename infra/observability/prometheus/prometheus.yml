global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'identity-access-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['identity-access-service:8081']

  - job_name: 'catalog-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['catalog-service:8082']

  - job_name: 'pricing-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['pricing-service:8083']

  - job_name: 'cart-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['cart-service:8084']

  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['inventory-service:8085']

  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-service:8086']

  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-service:8087']

  - job_name: 'fulfillment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['fulfillment-service:8088']

  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notification-service:8089']

  - job_name: 'audit-compliance-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['audit-compliance-service:8090']

  - job_name: 'business-configuration-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['business-configuration-service:8091']

  - job_name: 'exception-management-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['exception-management-service:8092']
